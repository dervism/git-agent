# Builds the website in site/ and publishes it to GitHub Pages. The docs page
# is the README, and the site shows the version from Cargo.toml, so a change to
# either rebuilds the site too.
name: Website

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "README.md"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling a deployment midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The docs page says when the README last changed, which needs the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the job that deploys can write to Pages, so build tools never get these.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
