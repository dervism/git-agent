# Builds the website in site/ and publishes it to GitHub Pages. The docs page
# is the README, and the site shows the version from Cargo.toml, so a change to
# either rebuilds the site too.
name: Website

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "README.md"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling a deployment midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The docs page says when the README last changed, which needs the history.
          fetch-depth: 0
      - uses: withastro/action@v6
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
