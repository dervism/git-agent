[package]
name = "git-agent"
version = "0.11.0"
edition = "2024"
rust-version = "1.88"
description = "Commit messages, branches, tidy-ups and pull requests from your git changes, with a local or cloud language model"
license = "MIT"
repository = "https://github.com/dervism/git-agent"
keywords = ["git", "commit", "llm", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]
# Only what the crate needs, so a new folder in the repository stays out by default.
include = ["/src/**", "/LICENSE", "/README.md"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
inquire = "0.9"
regex-lite = "0.1.9"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "process", "rt", "signal", "time"] }
toml = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
