[package]
name = "git-agent"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
description = "Generate git commit messages from your changes with a language model"
license = "MIT"
repository = "https://github.com/dervism/git-agent"
keywords = ["git", "commit", "llm", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]
# The website lives in the repository but not in the crate.
exclude = ["site/", ".claude/"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
inquire = "0.9"
regex-lite = "0.1.9"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt", "time"] }
toml = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
