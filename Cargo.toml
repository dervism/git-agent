[package]
name = "git-agent"
version = "0.2.0"
edition = "2024"
description = "Generate git commit messages from your changes with a local LLM"
license = "MIT"
repository = "https://github.com/dervism/git-agent"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt", "time"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
